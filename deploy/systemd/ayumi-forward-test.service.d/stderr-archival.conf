# systemd drop-in for ayumi-forward-test.service (card 68d4b7fe)
# Per-restart stderr archival: archives the previous run's stderr before the
# new run opens the append target, so pre-restart stderr is retrievable at
# logs/stderr-archive/forward_test-stderr-<UTC-ts>.log.
#
# APPLY (requires Ava-approved restart window per card AC #2 / HR2):
#   sudo mkdir -p /etc/systemd/system/ayumi-forward-test.service.d
#   sudo cp deploy/systemd/ayumi-forward-test.service.d/stderr-archival.conf \
#        /etc/systemd/system/ayumi-forward-test.service.d/
#   sudo chmod 644 /etc/systemd/system/ayumi-forward-test.service.d/stderr-archival.conf
#   sudo systemctl daemon-reload
#   # then restart the service inside the approved window:
#   sudo systemctl restart ayumi-forward-test.service
# Verify:
#   journalctl -u ayumi-forward-test.service -n 5 --no-pager
#   ls /home/TacoPants/projects/Ayumi/logs/stderr-archive/ | tail -5

[Service]
ExecStartPre=/home/TacoPants/projects/Ayumi/scripts/systemd/archive_stderr.sh
