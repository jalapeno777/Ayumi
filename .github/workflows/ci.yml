name: Ayumi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install ruff bandit
      - name: Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xf gitleaks_8.21.2_linux_x64.tar.gz
          ./gitleaks detect --source . --config .gitleaks.toml --verbose --report-format json --report-path gitleaks-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Ruff lint + format
        run: ruff check src/ tests/ --ignore E501 && ruff format --check src/ tests/
      - name: Bandit security scan
        run: bandit -r src/ -ll --format txt

  lint-test:
    runs-on: ubuntu-latest
    needs: scan-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -q --tb=line -p no:cacheprovider
