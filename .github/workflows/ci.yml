name: Ayumi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install ruff
      - name: Ruff lint (Python)
        run: ruff check src/ tests/ --ignore E501
      - name: Ruff format check
        run: ruff format --check src/ tests/

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install bandit safety
      - name: Bandit security scan (Python)
        run: bandit -r src/ -ll -ii --format txt || true
      - name: Safety dependency audit
        run: |
          if [ -f requirements.txt ]; then
            safety check -r requirements.txt --full-report
          else
            echo "No requirements.txt — skipping dependency audit"
          fi

  test:
    runs-on: ubuntu-latest
    needs: [secret-scan, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pytest
      - name: Run tests
        run: pytest tests/ -v --tb=short
