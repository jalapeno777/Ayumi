name: Ayumi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: pip install ruff bandit
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Ruff lint + format
        run: ruff check src/ tests/ --ignore E501 && ruff format --check src/ tests/
      - name: Bandit security scan
        run: bandit -r src/ -ll --format txt

  test:
    runs-on: ubuntu-latest
    needs: scan-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pytest
      - name: Run tests
        run: pytest tests/ -v --tb=short
