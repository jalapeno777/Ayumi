# ── Signal Filters ─────────────────────────────────────────────────────────
# FilterChain configuration: filters run in priority order (ascending).
# First filter to reject a signal stops the chain (short-circuit).
# Set enabled: false to skip a filter entirely.
filters:
  trend:
    enabled: true
    ema_fast_period: 9
    ema_slow_period: 21
    tolerance_pips: 0.0
  atr:
    enabled: true
  fvg:
    enabled: true
  orb:
    enabled: true
    min_score_threshold: 0.3
    breakout_min_fraction: 0.10

forward_test:
  account_balance: 100000  # Phase 0: FTMO 1-Step canonical ($100K)
  spread_pips:
    GBPUSD: 2.0
    EURUSD: 2.0
    USDJPY: 2.0
    XAUUSD: 40.0
    AUDUSD: 2.0
    USDCHF: 2.0
    USDCAD: 2.0
  ftmo:
    # Phase 0: FTMO 1-Step canonical values (3% daily / 10% total / $100K)
    # Source of truth: risk/ftmo_guard.py FTMOGuard defaults
    daily_loss_limit_pct: 0.03
    total_drawdown_limit_pct: 0.10
    max_positions: 3
    max_trades_per_day: 10
    min_risk_reward: 0.0

  strategies:
    - id: srmr_gbpusd_h1
      type: srmr_plus
      symbol: GBPUSD
      timeframe: H1
      min_confidence: 0.40
      enabled: true
      params:
        session_range_min_pips: 25.0
        entry_near_extreme_pips: 15.0
        hard_cap_sl_pips: 25.0
        tp1_rr: 1.5
        tp2_rr: 1.5

    - id: srmr_eurusd_h1
      type: srmr_plus
      symbol: EURUSD
      timeframe: H1
      min_confidence: 0.40
      enabled: true
      params:
        session_range_min_pips: 15.0
        entry_near_extreme_pips: 12.0
        hard_cap_sl_pips: 20.0
        tp1_rr: 1.5
        tp2_rr: 1.5

    - id: srmr_xauusd_h1
      type: srmr_plus
      symbol: XAUUSD
      timeframe: H1
      min_confidence: 0.40
      enabled: true
      params:
        session_range_min_pips: 200.0
        entry_near_extreme_pips: 150.0
        hard_cap_sl_pips: 300.0
        tp1_rr: 1.5
        tp2_rr: 1.5
        pip_value: 0.01

    - id: srmr_usdjpy_h1
      type: srmr_plus
      symbol: USDJPY
      timeframe: H1
      min_confidence: 0.40
      enabled: true
      params:
        session_range_min_pips: 15.0
        entry_near_extreme_pips: 12.0
        hard_cap_sl_pips: 20.0
        tp1_rr: 1.5
        tp2_rr: 1.5
        pip_value: 0.01

    - id: srmr_audusd_h1
      type: srmr_plus
      symbol: AUDUSD
      timeframe: H1
      min_confidence: 0.40
      enabled: false  # Phase 0: disabled — no historical data available (latent bug)
      params:
        session_range_min_pips: 15.0
        entry_near_extreme_pips: 12.0
        hard_cap_sl_pips: 20.0
        tp1_rr: 1.5
        tp2_rr: 1.5

    - id: srmr_usdchf_h1
      type: srmr_plus
      symbol: USDCHF
      timeframe: H1
      min_confidence: 0.40
      enabled: false  # Phase 0: disabled — no historical data available (latent bug)
      params:
        session_range_min_pips: 15.0
        entry_near_extreme_pips: 12.0
        hard_cap_sl_pips: 20.0
        tp1_rr: 1.5
        tp2_rr: 1.5

    - id: srmr_usdcad_h1
      type: srmr_plus
      symbol: USDCAD
      timeframe: H1
      min_confidence: 0.40
      enabled: false  # Phase 0: disabled — no historical data available (latent bug)
      params:
        session_range_min_pips: 15.0
        entry_near_extreme_pips: 12.0
        hard_cap_sl_pips: 20.0
        tp1_rr: 1.5
        tp2_rr: 1.5

    - id: ttc_xauusd_h1
      type: ttc
